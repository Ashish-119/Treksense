<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TrekSense — Explore Himalayan Treks</title>
  <meta name="description" content="TrekSense: live weather, oxygen levels, difficulty maps, gear lists, wildlife and best prices for Indian Himalayan treks." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏔️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <h1 id="page-title">Explore Treks</h1>
      <p id="page-sub">Weather, oxygen, difficulty &amp; gear intel for the Indian Himalayas.</p>
    </div>

    <div class="search-row">
      <label class="search-box" for="search-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search treks, regions..." autocomplete="off" />
      </label>
      <button class="filter-btn" id="filter-toggle" aria-label="Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2.2"/><circle cx="8" cy="16" r="2.2"/></svg>
      </button>
    </div>

    <div class="filter-panel" id="filter-panel">
      <div class="filter-group">
        <h4>Difficulty</h4>
        <div class="chip-row" id="chips-difficulty"></div>
      </div>
      <div class="filter-group">
        <h4>Season</h4>
        <div class="chip-row" id="chips-season"></div>
      </div>
      <div class="filter-group">
        <h4>Sort by</h4>
        <div class="chip-row" id="chips-sort"></div>
      </div>
    </div>

    <div class="results-meta">
      <span id="results-count"></span>
    </div>

    <div class="trek-grid" id="trek-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <strong>TrekSense</strong> — plan smarter, trek safer. Altitude &amp; oxygen figures are estimates; always follow your trek leader.
    </div>
  </footer>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Primary"></nav>

  <script src="js/data.js"></script>
  <script src="js/data2.js"></script>
  <script src="js/images.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
